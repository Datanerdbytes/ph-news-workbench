name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Route handlers and pages are force-dynamic, so the build never
      # touches the database — the placeholder URL only satisfies the
      # module-level `neon(process.env.DATABASE_URL!)` import.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          BETTER_AUTH_SECRET: ci-build-placeholder
