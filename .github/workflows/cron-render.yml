# Cron executors for the Render deployment (active). The Vercel twin lives in
# cron-vercel.yml and stays disabled until that deployment is unpaused.
#
# Both endpoints are POST and authorize with
# `Authorization: Bearer $CRON_SECRET_RENDER` — the same contract the local
# scheduler warns about in lib/local-scheduler.ts.
#
# Note GitHub's scheduler can lag a few minutes behind these times, and
# scheduled workflows are auto-disabled after 60 days of repo inactivity.
name: Cron (Render)

on:
  schedule:
    - cron: "*/5 * * * *" # scheduling sweep — publish due posts, sync Facebook-native schedules
    - cron: "0 * * * *" # feed ingest — pull new items from RSS sources

concurrency:
  group: cron-render-${{ github.event.schedule }}
  cancel-in-progress: false

jobs:
  schedule-run:
    if: github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger the scheduling sweep
        run: |
          curl -fsS --max-time 300 -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET_RENDER }}" \
            "${{ vars.RENDER_URL || 'https://ph-news-workbench.onrender.com' }}/api/schedule/run"

  ingest:
    if: github.event.schedule == '0 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger the feed ingest
        run: |
          curl -fsS --max-time 300 -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET_RENDER }}" \
            "${{ vars.RENDER_URL || 'https://ph-news-workbench.onrender.com' }}/api/ingest"
